name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python 3.10)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.0"
          python-version: "3.10"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Compile
        run: uv run python -m compileall -q app tests

      - name: Test
        run: uv run pytest -q -rs
